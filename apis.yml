apis:
- aid: melty-kisee
  name: Kisee — Identity Provider Server
  description: >-
    Kisee is an open-source HTTP API server published by Melty Group that exchanges valid
    username/password pairs for JSON Web Tokens, and nothing else. It is self-hosted software, not a
    Melty-operated public API: you install it from PyPI and run it yourself against your own identity
    backend (LDAP, PostgreSQL, a flat file, or any backend you implement as a Python class). Responses
    are CoreJSON hypermedia documents. Last released to PyPI as 21.9.0 in September 2021. No OpenAPI,
    AsyncAPI or GraphQL SDL is published for it.
  humanURL: https://kisee.readthedocs.io/en/latest/
  baseURL: http://{host}:8140
  tags:
  - Identity
  - Authentication
  - JWT
  - Open Source
  - Self-Hosted
  properties:
  - type: Documentation
    url: https://kisee.readthedocs.io/en/latest/
  - type: SourceCode
    url: https://github.com/meltygroup/kisee
  - type: License
    url: https://github.com/meltygroup/kisee/blob/master/LICENSE
- aid: melty-pasee
  name: Pasee — Identity Management Server
  description: >-
    Pasee is an open-source HTTP API server published by Melty Group that layers group and user
    management over one or more identity providers — one or many Kisee instances plus external
    providers such as Twitter or GitHub. It serves a JSON-Home document at its root describing its
    users, groups and tokens resources, and issues ES256-signed JWTs. Self-hosted software rather
    than a Melty-operated public API; last released to PyPI as 21.4.1 in April 2021. No OpenAPI,
    AsyncAPI or GraphQL SDL is published for it.
  humanURL: https://pasee.readthedocs.io/en/latest/
  baseURL: http://{host}:8150
  tags:
  - Identity
  - Authentication
  - JWT
  - Open Source
  - Self-Hosted
  properties:
  - type: Documentation
    url: https://pasee.readthedocs.io/en/latest/
  - type: SourceCode
    url: https://github.com/meltygroup/pasee
  - type: License
    url: https://github.com/meltygroup/pasee/blob/master/LICENSE
