aid: melty
name: Melty
description: >-
  Melty is a French digital media brand for youth culture — news and entertainment coverage of
  series, cinema, television, celebrity, gaming and lifestyle aimed at a 15-34 audience. Founded in
  2008 in Paris and operated by EEPLE SAS, Melty was a Serena Capital portfolio company before
  Reworld Media acquired 100% of the business in a distressed M&A process completed in 2021-2022;
  melty.fr is now published by EEPLE within Groupe Reworld Media and monetised through advertising
  and native content rather than software licensing. Melty publishes no developer program, no public
  API product and no machine-readable API contract. Its only public developer surface is the
  meltygroup GitHub organisation, which carries the identity servers Kisee and Pasee — MIT-licensed,
  self-hosted Python HTTP API servers written in-house and released to PyPI, last published in 2021.
